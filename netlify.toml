# Static site: no build step, files are served as-is.
[build]
  publish = "."

# Serve the custom 404 for any unmatched path.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fingerprinted-by-hand assets: safe to cache aggressively.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/resume/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
